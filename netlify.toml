[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions (replaces Express backend)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment variables (set these in Netlify dashboard):
#   VITE_SUPABASE_URL       - Your Supabase project URL (required for multi-device)
#   VITE_SUPABASE_ANON_KEY  - Your Supabase anonymous key (required for multi-device)
#   VITE_GEMINI_API_KEY     - Gemini API key (optional, for AI features)
#
# Required for Netlify Functions:
#   SUPABASE_SERVICE_ROLE_KEY - Your Supabase service_role key (for server-side operations)
#   SUPABASE_URL              - Same as VITE_SUPABASE_URL
#   SESSION_SECRET            - Random string for session encryption

# SPA fallback - serve index.html for all non-file routes
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://openrouter.ai https://open.bigmodel.cn https://api.openai.com https://api.opencode.ai; worker-src 'self' blob:; frame-src 'self' blob:; form-action 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
