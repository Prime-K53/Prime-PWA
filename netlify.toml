[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Environment variables (set these in Netlify dashboard):
#   VITE_API_URL - Your production backend URL (e.g. https://your-api.com)
#   VITE_GEMINI_API_KEY - Gemini API key (if used)
